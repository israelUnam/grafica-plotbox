spring.application.name=graficas

# Directorio de almacenamiento de CSV
app.storage.path=./datos

# Límites de carga multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.port=17006

# Soporte para proxy inverso (Nginx, Apache, Traefik con HTTPS/SSL)
# Permite que Spring Security reconozca el protocolo y host correctos detrás de proxy
server.forward-headers-strategy=framework

# =======================================================
# Google OAuth2 Credentials
# Ingrese su Client ID y Client Secret de Google Cloud Console
# o defínalos como variables de entorno: GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET
#
# IMPORTANTE:
# {baseUrl}/login/oauth2/code/{registrationId} se resuelve dinámicamente según la URL
# por la que se accede (localhost, IP del servidor o dominio).
# En Google Cloud Console debe registrar como "URI de redireccionamiento autorizada":
#  - Para local:    http://localhost:17006/login/oauth2/code/google
#  - Para servidor: http://<IP_O_DOMINIO>:17006/login/oauth2/code/google (o https://... si usa SSL)
# =======================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:TU_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:TU_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# =======================================================
# Correos autorizados para acceder a la aplicación
# Ingrese los correos válidos separados por comas.
# Si se deja vacío, se permite cualquier cuenta de Google autenticada.
# Ejemplo: app.security.allowed-emails=admin@unam.mx,investigador@unam.mx
# O defina la variable de entorno ALLOWED_EMAILS
# =======================================================
app.security.allowed-emails=${ALLOWED_EMAILS:}
